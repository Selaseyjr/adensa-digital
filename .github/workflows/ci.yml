name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Compile checks & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lightweight secret scan over tracked files (P6.3): no
      # external tooling, prints locations only — never the
      # matched values — and fails the job on any detection.
      - name: Secret scan (tracked files)
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          PATTERNS = {
              "private-key-block": re.compile(
                  r"-----BEGIN [A-Z ]*PRIVATE KEY-----"
              ),
              "aws-access-key-id": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "github-token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{36,}\b"),
              "slack-token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
              "credential-assignment": re.compile(
                  r"(?i)\b(api[_-]?key|secret|password|token)\b"
                  r"\s*[:=]\s*[\"']?[A-Za-z0-9+/_-]{24,}"
              ),
              "url-with-embedded-credentials": re.compile(
                  r"\b(?:postgresql|postgres|mysql|redis)://"
                  r"[^\s:/\"'@]+:[^\s/\"'@]+@"
              ),
          }

          # Obvious non-secrets: documentation placeholders,
          # the synthetic test fixtures used throughout the
          # suite, and the throwaway CI service-container
          # credential (ephemeral runner, localhost only).
          ALLOWLIST = (
              "change-me",
              "not-a-secret",
              "not-a-real-secret",
              "super-secret-value",
              "placeholder",
              "example",
              "user:password",
              "user:pass",
              "user:secret",
              "//u:p@",
              "test_password",
              "adensa_ci_password",
              "your-",
              "xxxx",
          )

          files = subprocess.run(
              ["git", "ls-files"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.split()

          detections = 0

          for path in files:
              try:
                  text = open(path, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue

              for name, pattern in PATTERNS.items():
                  for match in pattern.finditer(text):
                      value = match.group(0)

                      if any(
                              marker in value.lower()
                              for marker in ALLOWLIST
                      ):
                          continue

                      line_no = text.count("\n", 0, match.start()) + 1
                      print(
                          f"SECRET DETECTED: {name} "
                          f"at {path}:{line_no} (value not shown)"
                      )
                      detections += 1

          if detections:
              print(
                  f"{detections} potential secret(s) found. "
                  "Remove them from source control and rotate "
                  "any real credential involved."
              )
              sys.exit(1)

          print("Secret scan clean.")
          PY

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-api.txt

      - name: Compile checks (compileall)
        run: python -m compileall -q app/ streamlit_app.py tests/

      # The pytest suite includes tests/test_database.py, which connects to
      # data/adensa.db at collection time. That file is git-ignored (*.db),
      # so CI bootstraps it from scratch with the project's canonical,
      # idempotent initializer: schema + synthetic operational dataset.
      # (Invoked inline to keep this change limited to CI configuration.)
      - name: Initialize development database
        run: |
          python - <<'PY'
          import logging

          from app.bootstrap import initialize_adensa

          logging.basicConfig(level=logging.INFO)
          initialize_adensa()
          PY

      - name: Run test suite
        run: python -m pytest

  postgres:
    name: PostgreSQL integration (pg16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adensa
          POSTGRES_PASSWORD: adensa_ci_password
          POSTGRES_DB: adensa_server
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adensa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-api.txt -r requirements-postgres.txt

      # The same opt-in suite used locally: pytest -m postgres
      # against a temporary database created on the service
      # container. The SQLite suite above stays untouched.
      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASES_URL: postgresql://adensa:adensa_ci_password@localhost:5432/adensa_server
        run: python -m pytest -m postgres

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
