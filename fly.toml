# fly.toml app configuration file — Adensa Digital API (P10.2).
#
# Topology (approved): Vercel (Next.js) → Fly.io (FastAPI) →
# Neon (PostgreSQL). This file configures only the API machine;
# the frontend is a Vercel deployment and the database is a
# Neon project — neither is managed here.
#
# Generated for demo-stability first: exactly one always-on
# machine (no scale-to-zero sleep during a live demonstration),
# /ready as the health check, and migrations applied by the
# release command before each deploy's traffic cutover.
#
# See https://fly.io/docs/reference/configuration/ for
# information about how to use this file.

app = "adensa-api"
primary_region = "fra"

[build]
  # Build from the repository's root Dockerfile.

[deploy]
  # Migrations run here, before the new release receives
  # traffic — the API process itself verifies and never
  # migrates (ADR-012). The command targets the same app
  # image; it needs DATABASE_URL (injected as a secret) and
  # the PostgreSQL driver (baked into the image).
  release_command = "python -m app.database"
[env]
  # Configuration NAMES only — values are injected as Fly
  # secrets at deploy time (fly secrets set ...), never
  # committed here:
  #
  #   DATABASE_URL         Neon PostgreSQL DSN (secret)
  #   ADENSA_API_KEY       shared machine credential (secret)
  #   ADENSA_CORS_ORIGINS  e.g. https://adensa-digital.vercel.app
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.ready]
      # Deployment health check: the API reports ready only
      # when the database is reachable and the schema is
      # current (startup verification semantics, P6.2).
      port = 8000
      type = "http"
      method = "GET"
      path = "/ready"
      interval = "30s"
      timeout = "5s"
      grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
